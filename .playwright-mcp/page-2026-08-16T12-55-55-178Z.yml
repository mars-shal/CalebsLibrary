    - main [ref=f11e28]:
      - generic [ref=f11e29]:
        - generic [ref=f11e30]: How it works
        - heading "What Caleb's Library is." [level=1] [ref=f11e31]
        - paragraph [ref=f11e32]: An open, community-run collection of student notes, study guides, and papers. Free to read, free to contribute, run by whoever shows up.
        - generic [ref=f11e35]:
          - paragraph [ref=f11e36]: It began, as most useful things do, as a shared folder. Caleb H. and three friends kept their notes in one place in 2019. That folder spread — first to their year, then to the years below them, then to departments they'd never taken.
          - paragraph [ref=f11e37]: Today it holds three thousand documents. Every one of them was left behind by a student who wanted the next person to have a slightly easier time than they did.
          - heading "Three rules." [level=2] [ref=f11e38]
          - list [ref=f11e39]:
            - listitem [ref=f11e40]:
              - generic [ref=f11e41]: RULE 01
              - generic [ref=f11e42]:
                - generic [ref=f11e43]: Attribution is not optional.
                - generic [ref=f11e44]: Every paper carries the name of the person who contributed it. Take credit for your work; give credit to others’.
            - listitem [ref=f11e45]:
              - generic [ref=f11e46]: RULE 02
              - generic [ref=f11e47]:
                - generic [ref=f11e48]: No commercial reuse.
                - generic [ref=f11e49]: The library is a gift from the community to the community. It stays that way.
            - listitem [ref=f11e50]:
              - generic [ref=f11e51]: RULE 03
              - generic [ref=f11e52]:
                - generic [ref=f11e53]: Moderators have the last word.
                - generic [ref=f11e54]: A small rotating group of contributors reviews every submission. They approve, request changes, or reject. Their decisions are appealable, but final.
          - heading "Who runs this." [level=2] [ref=f11e55]
          - paragraph [ref=f11e56]: Nobody, and everybody. Caleb started it; a rotating group of about a dozen contributors keeps it running. There's no university behind it, no company, no ads. If it stops working, whoever's around fixes it.
          - paragraph [ref=f11e57]: Uploads ask for a name and email — the email stays private and is only used if a moderator needs to reach you. There are no accounts to create, nothing to log in to. Read, upload, or leave.
          - heading "Want to help." [level=2] [ref=f11e58]
          - paragraph [ref=f11e59]: Upload something. Comment on something. Flag something that shouldn't be here. If you want to be a moderator, contribute a dozen papers first — we ask the top contributors when a moderator spot opens.
