<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      Connection warm-ups and the font stylesheet, deliberately in <head> rather
      than a CSS @import.

      A CSS @import of Google Fonts is only discovered after the main stylesheet
      has downloaded and parsed, so it serialises:
        HTML -> our CSS -> fonts.googleapis.com CSS -> fonts.gstatic.com files
      i.e. two extra DNS lookups and two TLS handshakes before any text renders.
      As <link>s the browser fetches them in parallel with the CSS.

      The Convex preconnect matters because the store queries the catalogue
      immediately on mount; without it every reader pays DNS + TLS before the
      first byte of data. %VITE_CONVEX_URL% is substituted at build time by Vite.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    >
    <link rel="preconnect" href="%VITE_CONVEX_URL%" crossorigin>
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    <title>Caleb's Library — Free. Open. No account needed.</title>
    <meta name="description" content="A free, open-source library for students by students. Share notes, past exams, study guides — no accounts, no paywalls.">
    <meta name="theme-color" content="#f5f2ea">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4SJRWGP4SZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-4SJRWGP4SZ');
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
